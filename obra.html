document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var btn=document.getElementById('b'),err=document.getElementById('e');
  btn.disabled=true;btn.textContent='Abrindo…';err.textContent='';
  try{
    var pw=document.getElementById('p').value;
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('gran_pw',pw)}catch(_){}
    document.open();document.write(html);document.close();
  }catch(_){

    btn.disabled=false;btn.textContent='Abrir';
