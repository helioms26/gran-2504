  ev.preventDefault();
  var btn=document.getElementById('b'),err=document.getElementById('e');

  try{
    var pw=document.getElementById('p').value;

    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('gran_pw',pw)}catch(_){}
